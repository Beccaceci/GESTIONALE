name: Build and Release Notes

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-course:
    name: Build ${{ matrix.target_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - folder: courses/first_year/ALGEBRA_LINEARE/notes
            target_name: Linear_Algebra
          - folder: courses/first_year/ANALISI1/notes
            target_name: Calculus_1
          - folder: courses/first_year/ANALISI2/notes
            target_name: Calculus_2
          - folder: courses/first_year/ECONOMIA/notes
            target_name: Economics
          - folder: courses/first_year/FISICA/notes
            target_name: Physics
          - folder: courses/first_year/STATISTICA/notes
            target_name: Probability_and_Statistics
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ${{ matrix.folder }}
          args: -pdf -file-line-error -interaction=nonstopmode -synctex=1

      - name: Stage Compiled PDF
        run: |
          mkdir -p build_output
          cp "${{ matrix.folder }}/main.pdf" "build_output/${{ matrix.target_name }}.pdf"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}-pdf
          path: build_output/${{ matrix.target_name }}.pdf
          retention-days: 7

  release:
    name: Publish Notes Archive & PDFs to GitHub Release
    needs: build-course
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_pdfs
          merge-multiple: true

      - name: Create All-In-One ZIP Bundle
        run: |
          cd release_pdfs
          zip -9 All_Courses_Notes.zip *.pdf
          cd ..

      - name: List Release Files
        run: |
          ls -la release_pdfs/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "University Lecture Notes (Compiled PDFs & Bundle)"
          body: |
            ## 📚 Latest Compiled University Lecture Notes

            All documents have been compiled automatically with TeX Live via GitHub Actions.

            ### 📦 Complete Bundle:
            - [**Download All Notes (ZIP)**](https://github.com/${{ github.repository }}/releases/latest/download/All_Courses_Notes.zip)

            ### 📄 First-Year Courses:
            - [Linear Algebra and Geometry](https://github.com/${{ github.repository }}/releases/latest/download/Linear_Algebra.pdf)
            - [Calculus 1](https://github.com/${{ github.repository }}/releases/latest/download/Calculus_1.pdf)
            - [Calculus 2](https://github.com/${{ github.repository }}/releases/latest/download/Calculus_2.pdf)
            - [Economics & Business Organization](https://github.com/${{ github.repository }}/releases/latest/download/Economics.pdf)
            - [General Physics](https://github.com/${{ github.repository }}/releases/latest/download/Physics.pdf)
            - [Probability and Statistics](https://github.com/${{ github.repository }}/releases/latest/download/Probability_and_Statistics.pdf)

            _Updated at commit:_ `${{ github.sha }}`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_pdfs/*.pdf
            release_pdfs/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
